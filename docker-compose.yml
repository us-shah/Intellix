services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellixdb
      POSTGRES_USER: intellix
      POSTGRES_PASSWORD: intellix_dev_password
    ports:
      - "5432:5432"
    volumes:
      - intellix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellix -d intellixdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intellix_postgres_data:
